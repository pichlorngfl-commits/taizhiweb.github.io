<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taizhi Webside</title>
    <link rel="icon" href="Taizhi none background.png">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/0908828f07.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
    <!--Mobile Navbar-->
    <header class="mobile-header md:hidden">
        <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <a href="#" class="small-image"><img src="Taizhi none background.png" alt="Taizhi home"></a>
        <h2 class="display-block text-xl font-bold">TAIZHISCHOOL X LIBRARY</h2>
        <nav id="mobile-menu" class="mobile-menu" aria-label="Main navigation">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Audio</a>
            <a href="#">English</a>
            <a href="#">Chinese</a>
            <a href="#">Pingin</a>
            <a href="spinwheel.html">Challenge</a>
        </nav>
    </header>
    <!--End Mobile Navbar-->
<!--big screen-->

    <script>
        const menuButton = document.querySelector('.menu-button');
        const mobileMenu = document.querySelector('.mobile-menu');

        if (menuButton && mobileMenu) {
            menuButton.addEventListener('click', () => {
                const isOpen = mobileMenu.classList.toggle('is-open');
                menuButton.classList.toggle('is-open', isOpen);
                menuButton.setAttribute('aria-expanded', isOpen);
                menuButton.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
            });
        }
    </script>
</body>
</html>
